<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TV Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@200..800&display=swap">
<link rel="stylesheet" href="css/base.css?v=0.9.3">
<link rel="stylesheet" href="css/home.css?v=0.9.3">
<link rel="stylesheet" href="css/settings.css?v=0.9.3">
<link rel="stylesheet" href="css/overlays.css?v=0.9.3">
<link rel="stylesheet" href="css/saver.css?v=0.9.3">
<link rel="stylesheet" href="css/toast.css?v=0.9.3">
<link rel="stylesheet" href="css/hud.css?v=0.9.3">
<link rel="stylesheet" href="css/access.css?v=0.9.3">
<link rel="stylesheet" href="css/blur.css?v=0.9.3">
<link rel="stylesheet" href="css/perf.css?v=0.9.3">
</head>
<body>
<div id="stage">
  <div id="bg"></div>
  <div id="shade"></div>

  <div id="home">
    <div id="brand"></div>
    <div id="clockbox">
      <div id="clock">--:--</div>
      <div id="date"></div>
    </div>

    <div id="widgets">
      <div class="glass widget" id="w-weather">
        <div class="w-title">Weather</div>
        <div class="w-big" id="w-temp">--&deg;</div>
        <div class="w-sub" id="w-desc">Loading...</div>
        <div class="w-sub dim" id="w-place"></div>
      </div>
      <div class="glass widget" id="w-wall">
        <div class="w-title">Wallpaper</div>
        <div class="w-big small" id="w-wname">-</div>
        <div class="w-sub dim">Change it in Settings</div>
      </div>
    </div>

    <div id="rowwrap">
      <div id="row"></div>
    </div>

    <div id="recent">
      <div class="sec">Recently opened</div>
      <div id="rrow"></div>
      <div id="rempty">Apps you open will show up here</div>
    </div>

    <div id="hints" class="glass">
      <span><b>&#9664; &#9654;</b> Browse</span>
      <span><b>&#9650; &#9660;</b> Rows</span>
      <span><b>OK</b> Open</span>
    </div>
  </div>

  <div id="panelwrap">
    <div id="spage">
      <div id="stitle">Settings</div>
      <div id="slist"></div>
    </div>
    <div id="sdetail">
      <div id="sleft"><div id="sicon" class="sico"></div><div id="sname"></div><div id="sdesc"></div></div>
      <div id="sright"></div>
    </div>
    <div id="phint">&#9650; &#9660; Move &nbsp;&nbsp; OK Select &nbsp;&nbsp; Back Return</div>
  </div>

  <div id="dimmer"></div>
  <div id="saver"><div id="saverbox"><div id="saverclock">--:--</div><div id="saverdate"></div></div></div>

  <div id="splash"><canvas id="blob" width="300" height="300"></canvas></div>
  <div id="debug"></div>
  <div id="hud"></div>
  <div id="toast"></div>
  <div id="ver"></div>
</div>

<!-- Load order matters: core state first, features next, settings categories, then input and boot last. -->
<script src="js/config.js?v=0.9.3"></script>
<script src="js/core.js?v=0.9.3"></script>
<script src="js/stage.js?v=0.9.3"></script>
<script src="js/clock.js?v=0.9.3"></script>
<script src="js/toast.js?v=0.9.3"></script>
<script src="js/apps.js?v=0.9.3"></script>
<script src="js/wallpaper.js?v=0.9.3"></script>
<script src="js/wallpaper-auto.js?v=0.9.3"></script>
<script src="js/audio.js?v=0.9.3"></script>
<script src="js/rows.js?v=0.9.3"></script>
<script src="js/home-layout.js?v=0.9.3"></script>
<script src="js/weather-cities.js?v=0.9.3"></script>
<script src="js/weather.js?v=0.9.3"></script>
<script src="js/saver.js?v=0.9.3"></script>
<script src="js/splash.js?v=0.9.3"></script>
<script src="js/debug.js?v=0.9.3"></script>
<script src="js/perf-stats.js?v=0.9.3"></script>
<script src="js/perf-hud.js?v=0.9.3"></script>
<script src="js/perf-stress.js?v=0.9.3"></script>
<script src="js/perf.js?v=0.9.3"></script>
<script src="js/storage-tools.js?v=0.9.3"></script>
<script src="js/blur.js?v=0.9.3"></script>
<script src="js/access.js?v=0.9.3"></script>
<script src="js/settings-icons.js?v=0.9.3"></script>
<script src="js/settings-core.js?v=0.9.3"></script>
<script src="js/settings-general.js?v=0.9.3"></script>
<script src="js/settings-home.js?v=0.9.3"></script>
<script src="js/settings-apps.js?v=0.9.3"></script>
<script src="js/settings-appearance.js?v=0.9.3"></script>
<script src="js/settings-weather.js?v=0.9.3"></script>
<script src="js/settings-sounds.js?v=0.9.3"></script>
<script src="js/settings-saver.js?v=0.9.3"></script>
<script src="js/settings-perf.js?v=0.9.3"></script>
<script src="js/settings-access.js?v=0.9.3"></script>
<script src="js/settings-network.js?v=0.9.3"></script>
<script src="js/settings-remote.js?v=0.9.3"></script>
<script src="js/settings-about.js?v=0.9.3"></script>
<script src="js/settings-dev.js?v=0.9.3"></script>
<script src="js/input.js?v=0.9.3"></script>
<script src="js/boot.js?v=0.9.3"></script>
</body>
</html>
