
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TV Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@200..800&display=swap">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; height: 100%; overflow: hidden; background: #000; color: #fff;
  font-family: "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif;
}
 
/* The whole UI is drawn on a fixed 1920x1080 stage and scaled to the screen. */
#stage {
  position: absolute; left: 0; top: 0; width: 1920px; height: 1080px;
  transform-origin: 0 0; overflow: hidden; background: #000;
}
 
/* Wallpaper: static layer, painted once. */
#bg { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transition: opacity .5s ease; }
#bg.swap { opacity: 0; }
 
#shade {
  position: absolute; left: 0; top: 0; width: 100%; height: 100%;
  background: linear-gradient(to bottom, rgba(0,0,0,.25) 0%, rgba(0,0,0,0) 35%, rgba(0,0,0,.45) 100%);
}
 
/* Glass panels are plain translucent (no blur) to keep weak TV chips smooth. */
.glass {
  background: rgba(20,28,44,.42);
  border: 1px solid rgba(255,255,255,.2);
  border-radius: 28px;
}
 
/* Home */
#home { position: absolute; left: 0; top: 0; width: 100%; height: 100%; opacity: 0; transition: opacity .8s ease; }
#home.in { opacity: 1; }
 
#clockbox { position: absolute; left: 120px; top: 70px; }
#clock { font-size: 128px; font-weight: 200; letter-spacing: -2px; line-height: 1; }
#date { margin-top: 10px; font-size: 34px; font-weight: 400; opacity: .85; }
 
#widgets { position: absolute; right: 120px; top: 70px; width: 760px; height: 210px; }
.widget { position: absolute; top: 0; width: 360px; height: 210px; padding: 26px 30px; }
#w-weather { left: 0; }
#w-wall { right: 0; }
.w-title { font-size: 20px; text-transform: uppercase; letter-spacing: 3px; opacity: .7; }
.w-big { margin-top: 12px; font-size: 76px; font-weight: 200; line-height: 1; }
.w-big.small { font-size: 36px; font-weight: 500; margin-top: 30px; }
.w-sub { margin-top: 10px; font-size: 26px; }
.dim { opacity: .65; font-size: 22px; }
 
/* Tile row */
#rowwrap { position: absolute; left: 0; top: 540px; width: 100%; height: 360px; }
#row {
  position: absolute; left: 120px; top: 40px; white-space: nowrap; font-size: 0;
  transition: -webkit-transform .25s ease-out, transform .25s ease-out;
}
.tile {
  position: relative; display: inline-block; vertical-align: top;
  width: 380px; height: 214px; margin-right: 30px; border-radius: 22px; overflow: hidden;
  transition: -webkit-transform .2s ease-out, transform .2s ease-out;
  will-change: transform;
}
.tile .mono {
  position: absolute; left: 0; top: 0; width: 100%; height: 100%;
  font-size: 120px; font-weight: 700; line-height: 214px; text-align: center; opacity: .92;
}
.tile img { position: absolute; left: 50%; top: 46%; width: 150px; height: 90px; object-fit: contain; -webkit-transform: translate(-50%,-55%); transform: translate(-50%,-55%); }
.tile img.fav { top: 44%; width: 112px; height: 112px; padding: 14px; background: #fff; border-radius: 26px; }
.tile .nm {
  position: absolute; left: 0; bottom: 0; width: 100%; padding: 14px 22px; font-size: 26px; font-weight: 600;
  background: linear-gradient(to top, rgba(0,0,0,.5), rgba(0,0,0,0));
}
.tile.focus {
  -webkit-transform: translateY(-14px) scale(1.14); transform: translateY(-14px) scale(1.14);
  box-shadow: 0 0 0 4px rgba(255,255,255,.9);
  z-index: 5;
}
 
/* Hint bar */
#hints {
  position: absolute; left: 50%; bottom: 46px; margin-left: -480px; width: 960px; height: 64px;
  border-radius: 32px; padding: 0 34px; font-size: 22px; line-height: 62px; white-space: nowrap; text-align: center; opacity: .9;
}
#hints span { margin: 0 12px; }
#hints .k { margin-right: 4px; font-size: 20px; }
#hints .r { color: #ff6b6b; } #hints .g { color: #5bd98c; } #hints .y { color: #ffd84d; } #hints .b { color: #5aa9ff; }
 
/* Screensaver */
#saver {
  position: absolute; left: 0; top: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,.62); opacity: 0; pointer-events: none; transition: opacity 1.5s ease;
}
#saver.on { opacity: 1; }
#saverclock {
  position: absolute; left: 0; top: 0; font-size: 220px; font-weight: 200; letter-spacing: -4px;
  transition: -webkit-transform 4s ease-in-out, transform 4s ease-in-out; opacity: .9;
}
 
/* Splash */
#splash {
  position: absolute; left: 0; top: 0; width: 100%; height: 100%; background: #000;
  transition: opacity .6s ease;
}
#splash canvas { position: absolute; left: 660px; top: 240px; width: 600px; height: 600px; }
#splash.out { opacity: 0; pointer-events: none; }
#splash.gone { display: none; }
 
/* Debug overlay */
#debug {
  display: none; position: absolute; left: 20px; top: 20px; padding: 14px 20px; border-radius: 14px;
  background: rgba(0,0,0,.75); font: 22px/1.4 monospace; z-index: 99; white-space: pre;
}
 
#brand {
  position: absolute; left: 120px; top: 18px; height: 44px; line-height: 44px; white-space: nowrap;
  font-family: "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif;
  font-size: 40px; font-weight: 800; letter-spacing: -1px; text-transform: lowercase;
}
#brand .tv {
  display: inline-block; margin-left: 12px; padding: 0 11px; height: 30px; line-height: 30px; vertical-align: middle;
  position: relative; top: -2px; border-radius: 8px; background: #fff; color: #111;
  font-size: 20px; letter-spacing: 2px; text-transform: uppercase;
}
 
/* Lite mode: zero animation, minimal painting. Toggle with key 1, or open the app URL with ?lite=1 */
body.lite * { transition: none !important; animation: none !important; }
body.lite #shade { display: none; }
body.lite .tile { border-radius: 0; will-change: auto; }
body.lite .tile.focus { -webkit-transform: none; transform: none; }
body.lite .glass { border-radius: 0; }
</style>
</head>
<body>
<div id="stage">
  <div id="bg"></div>
  <div id="shade"></div>
 
  <div id="home">
    <div id="brand"></div>
    <div id="clockbox">
      <div id="clock">--:--</div>
      <div id="date"></div>
    </div>
 
    <div id="widgets">
      <div class="glass widget" id="w-weather">
        <div class="w-title">Weather</div>
        <div class="w-big" id="w-temp">--&deg;</div>
        <div class="w-sub" id="w-desc">Loading...</div>
        <div class="w-sub dim" id="w-place"></div>
      </div>
      <div class="glass widget" id="w-wall">
        <div class="w-title">Wallpaper</div>
        <div class="w-big small" id="w-wname">-</div>
        <div class="w-sub dim">Press RED to change</div>
      </div>
    </div>
 
    <div id="rowwrap">
      <div id="row"></div>
    </div>
 
    <div id="hints" class="glass">
      <span><b>&#9664; &#9654;</b> Browse</span>
      <span><b>OK</b> Open</span>
      <span><b>&#9650;</b> Wallpaper</span>
      <span><b>&#9660;</b> Info</span>
  </div>
 
  <div id="saver"><div id="saverclock">--:--</div></div>
 
  <div id="splash"><canvas id="blob" width="300" height="300"></canvas></div>
  <div id="debug"></div>
</div>
 
<script>
// ===== TV Home config: edit the tiles, city and options below, push to GitHub, then reopen the app on the TV =====
window.TVHOME_CONFIG = {
  // App name shown on the home screen and in the page title.
  name: "Kivo TV",
 
  // Weather widget (Open-Meteo, no API key needed). Change to your city.
  weather: { name: "Hradec Kralove", lat: 50.2104, lon: 15.8252 },
 
  // Idle time before the clock screensaver starts.
  saverAfterSec: 120,
 
  // Lite mode: no animations at all. Also toggled with key 1 on the remote, or add ?lite=1 to the app URL.
  lite: false,
 
  // UI blips on move / select. Off by default: audio can make key presses lag on weak TVs.
  sounds: false,
 
  // Tiles. Each one opens its URL in the TV browser engine.
  // name:  label under the tile
  // url:   where Enter goes
  // color: two gradient colors
  // icon:  optional image URL (otherwise the first letter is shown big)
  tiles: [
    { name: "YouTube",     url: "https://www.youtube.com/tv",              color: ["#ff5a5a", "#a30f2d"], icon: "https://cdn.simpleicons.org/youtube/white",    domain: "youtube.com" },
    { name: "Netflix",     url: "https://www.netflix.com/",                color: ["#e50914", "#6b0409"], icon: "https://cdn.simpleicons.org/netflix/white",    domain: "netflix.com" },
    { name: "Prime Video", url: "https://www.primevideo.com/",             color: ["#1fa3ff", "#0b4a85"], icon: "https://cdn.simpleicons.org/primevideo/white", domain: "primevideo.com" },
    { name: "Disney+",     url: "https://www.disneyplus.com/",             color: ["#2f6bff", "#0f2468"], icon: "https://cdn.simpleicons.org/disneyplus/white", domain: "disneyplus.com" },
    { name: "Twitch",      url: "https://www.twitch.tv/",                  color: ["#9146ff", "#43199e"], icon: "https://cdn.simpleicons.org/twitch/white",     domain: "twitch.tv" },
    { name: "Spotify",     url: "https://open.spotify.com/",               color: ["#1ed760", "#0a5f2c"], icon: "https://cdn.simpleicons.org/spotify/white",    domain: "spotify.com" },
    { name: "Plex",        url: "https://app.plex.tv/desktop/",            color: ["#f0a90f", "#7a4f00"], icon: "https://cdn.simpleicons.org/plex/white",       domain: "plex.tv" },
    { name: "iVysilani",   url: "https://www.ceskatelevize.cz/ivysilani/", color: ["#12a8c4", "#0b6b80"], domain: "ceskatelevize.cz" }
  ]
};
</script>
<script>
/* TV Home - Apple TV style launcher for VIDAA (hisense://debug web app).
   Plain ES5 on purpose: older TV browsers choke on modern syntax. */
(function () {
  "use strict";
 
  var C = window.TVHOME_CONFIG || { tiles: [], weather: { name: "", lat: 50, lon: 15 }, saverAfterSec: 120, sounds: true };
  function $(id) { return document.getElementById(id); }
  function store(k, v) { try { if (v === undefined) { return localStorage.getItem(k); } localStorage.setItem(k, v); } catch (e) {} return null; }
  function pad(n) { return (n < 10 ? "0" : "") + n; }
 
  var stage = $("stage"), home = $("home"), row = $("row");
  var iconLog = {}, lastOffset = -1, lastHm = "", ready = false, focusIdx = 0, saverOn = false, lastActivity = Date.now();
 
  /* ---------- Fit 1920x1080 stage to the real screen ---------- */
  function fit() {
    var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    stage.style.webkitTransform = stage.style.transform = (s === 1 ? "none" : "scale(" + s + ")");
    stage.style.left = ((window.innerWidth - 1920 * s) / 2) + "px";
    stage.style.top = ((window.innerHeight - 1080 * s) / 2) + "px";
  }
  window.addEventListener("resize", fit);
  fit();
 
  /* ---------- Wallpapers (pure CSS gradients, no image files needed) ---------- */
  var WALLPAPERS = [
    { name: "Aurora",   css: "radial-gradient(900px 700px at 20% 30%, #1fd1a5 0%, transparent 60%), radial-gradient(1000px 800px at 80% 20%, #2b6fff 0%, transparent 60%), radial-gradient(900px 900px at 60% 90%, #0b1d4d 0%, transparent 70%), #04121f" },
    { name: "Ember",    css: "radial-gradient(900px 700px at 25% 75%, #ff8a3d 0%, transparent 60%), radial-gradient(1000px 800px at 80% 30%, #c2185b 0%, transparent 62%), radial-gradient(900px 900px at 50% 10%, #3a0a2e 0%, transparent 70%), #120309" },
    { name: "Glacier",  css: "radial-gradient(1000px 800px at 30% 20%, #9be7ff 0%, transparent 60%), radial-gradient(900px 800px at 85% 70%, #3a7bd5 0%, transparent 60%), radial-gradient(800px 800px at 10% 90%, #0f2a4a 0%, transparent 70%), #071524" },
    { name: "Meadow",   css: "radial-gradient(900px 700px at 70% 25%, #b8e986 0%, transparent 58%), radial-gradient(1000px 800px at 20% 70%, #1b8a5a 0%, transparent 62%), radial-gradient(900px 900px at 80% 95%, #0a3d2e 0%, transparent 70%), #05160f" },
    { name: "Dusk",     css: "radial-gradient(1000px 800px at 75% 25%, #ff9a8b 0%, transparent 60%), radial-gradient(900px 800px at 20% 30%, #4a6cf7 0%, transparent 62%), radial-gradient(1000px 900px at 50% 100%, #1b1f4b 0%, transparent 70%), #0a0c1f" },
    { name: "Lagoon",   css: "radial-gradient(900px 800px at 25% 25%, #00c9ff 0%, transparent 60%), radial-gradient(1000px 800px at 80% 75%, #0072b5 0%, transparent 62%), radial-gradient(800px 800px at 60% 10%, #92fe9d 0%, transparent 65%), #03202c" },
    { name: "Graphite", css: "radial-gradient(1000px 800px at 30% 25%, #5a6270 0%, transparent 60%), radial-gradient(900px 800px at 80% 70%, #2d3440 0%, transparent 62%), radial-gradient(900px 900px at 50% 100%, #0b0d12 0%, transparent 70%), #0c0e13" },
    { name: "Sand",     css: "radial-gradient(1000px 800px at 70% 30%, #f6d7a7 0%, transparent 60%), radial-gradient(900px 800px at 20% 75%, #c98a5a 0%, transparent 62%), radial-gradient(900px 900px at 80% 95%, #5a3a2a 0%, transparent 70%), #1a110c" },
    { name: "Nebula",   css: "radial-gradient(900px 800px at 20% 25%, #7b5cff 0%, transparent 60%), radial-gradient(1000px 800px at 85% 60%, #00d4ff 0%, transparent 62%), radial-gradient(900px 900px at 40% 100%, #1a0b3d 0%, transparent 70%), #07040f" },
    { name: "Pine",     css: "radial-gradient(1000px 800px at 75% 20%, #6fd3a0 0%, transparent 58%), radial-gradient(900px 800px at 15% 60%, #165a4a 0%, transparent 62%), radial-gradient(900px 900px at 60% 100%, #06231d 0%, transparent 70%), #04120e" }
  ];
  var wpIdx = 0;
  function setWallpaper(i, animate) {
    wpIdx = (i + WALLPAPERS.length) % WALLPAPERS.length;
    var bg = $("bg");
    function apply() {
      bg.style.background = WALLPAPERS[wpIdx].css;
      $("w-wname").textContent = WALLPAPERS[wpIdx].name;
      store("tvhome.wp", String(wpIdx));
    }
    if (!animate) { apply(); return; }
    bg.className = "swap";
    setTimeout(function () { apply(); bg.className = ""; }, 400);
  }
  function randomWallpaper() { // different one on every launch
    var last = parseInt(store("tvhome.wp"), 10);
    var i; do { i = Math.floor(Math.random() * WALLPAPERS.length); } while (i === last && WALLPAPERS.length > 1);
    setWallpaper(i, false);
  }
 
  /* ---------- Sounds (WebAudio blips) ---------- */
  var actx = null;
  function ensureAudio() {
    if (!C.sounds || actx) { return; }
    try { var A = window.AudioContext || window.webkitAudioContext; if (A) { actx = new A(); } } catch (e) { actx = null; }
  }
  function blip(freq, dur, vol) {
    if (!actx) { return; }
    try {
      var o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
      o.type = "sine"; o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + dur + 0.02);
    } catch (e) {}
  }
 
  /* ---------- Tiles ---------- */
  function buildTiles() {
    row.innerHTML = "";
    function tag(s) { return s.indexOf("icons/") === 0 ? "local" : (s.indexOf("simpleicons") > -1 ? "logo" : "favicon"); }
    function loadIcon(tile, t, srcs, i) {
      if (i === 0) { iconLog[t.name] = ""; }
      if (i >= srcs.length) { iconLog[t.name] += " -> letter"; mono(tile, t.name); return; }
      var im = document.createElement("img");
      if (srcs[i].indexOf("/s2/favicons") > -1) { im.className = "fav"; }
      im.onload = function () { iconLog[t.name] += " ok:" + tag(srcs[i]); };
      im.onerror = function () {
        iconLog[t.name] += " x:" + tag(srcs[i]);
        if (im.parentNode) { tile.removeChild(im); }
        loadIcon(tile, t, srcs, i + 1);
      };
      im.src = srcs[i];
      tile.appendChild(im);
    }
    function mono(tile, name) {
      var m = document.createElement("div");
      m.className = "mono"; m.textContent = name.charAt(0);
      tile.appendChild(m);
    }
    for (var i = 0; i < C.tiles.length; i++) {
      var t = C.tiles[i], d = document.createElement("div");
      d.className = "tile";
      d.style.background = "linear-gradient(135deg," + t.color[0] + "," + t.color[1] + ")";
      var srcs = ["icons/" + t.name.toLowerCase().replace(/[^a-z0-9]/g, "") + ".png"];
      if (t.icon) { srcs.push(t.icon); }
      if (t.domain) { srcs.push("https://www.google.com/s2/favicons?sz=256&domain=" + t.domain); }
      if (srcs.length) { loadIcon(d, t, srcs, 0); } else { mono(d, t.name); }
      var n = document.createElement("div"); n.className = "nm"; n.textContent = t.name; d.appendChild(n);
      row.appendChild(d);
    }
    setFocus(0, true);
  }
  function setFocus(i, silent) {
    var tiles = row.children;
    if (!tiles.length) { return; }
    i = Math.max(0, Math.min(tiles.length - 1, i));
    if (tiles[focusIdx]) { tiles[focusIdx].className = "tile"; }
    focusIdx = i;
    tiles[i].className = "tile focus";
    var step = 380 + 30;
    var offset = Math.max(0, (i + 1) * step + 120 - 1700);
    if (offset !== lastOffset) {
      lastOffset = offset;
      row.style.webkitTransform = row.style.transform = "translateX(" + (-offset) + "px)";
    }
  }
  function openTile() {
    var t = C.tiles[focusIdx];
    if (!t) { return; }
    blip(880, 0.12, 0.07);
    setTimeout(function () { window.location.href = t.url; }, 140);
  }
 
  /* ---------- Clock + date ---------- */
  var DAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
  var MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
  function tick() {
    var d = new Date(), hm = pad(d.getHours()) + ":" + pad(d.getMinutes());
    if (hm !== lastHm) {
      lastHm = hm;
      $("clock").textContent = hm;
      $("saverclock").textContent = hm;
      $("date").textContent = DAYS[d.getDay()] + ", " + d.getDate() + " " + MONTHS[d.getMonth()];
    }
    if (!saverOn && Date.now() - lastActivity > C.saverAfterSec * 1000 && ready) { showSaver(); }
  }
 
  /* ---------- Screensaver ---------- */
  var saverMove = null;
  function showSaver() {
    saverOn = true; $("saver").className = "on";
    moveSaver();
    saverMove = setInterval(moveSaver, 30000);
  }
  function moveSaver() {
    var c = $("saverclock");
    var tr = "translate(" + (120 + Math.floor(Math.random() * 1000)) + "px," + (80 + Math.floor(Math.random() * 640)) + "px)";
    c.style.webkitTransform = c.style.transform = tr;
  }
  function hideSaver() {
    saverOn = false; $("saver").className = ""; clearInterval(saverMove);
  }
 
  /* ---------- Weather (Open-Meteo) ---------- */
  function codeText(c) {
    if (c === 0) { return "Clear"; }
    if (c <= 2) { return "Partly cloudy"; }
    if (c === 3) { return "Overcast"; }
    if (c === 45 || c === 48) { return "Fog"; }
    if (c >= 51 && c <= 57) { return "Drizzle"; }
    if (c >= 61 && c <= 67) { return "Rain"; }
    if (c >= 71 && c <= 77) { return "Snow"; }
    if (c >= 80 && c <= 82) { return "Showers"; }
    if (c >= 85 && c <= 86) { return "Snow showers"; }
    if (c >= 95) { return "Thunderstorm"; }
    return "-";
  }
  function showWeather(t, code) {
    $("w-temp").innerHTML = Math.round(t) + "&deg;";
    $("w-desc").textContent = codeText(code);
    $("w-place").textContent = C.weather.name;
  }
  function loadWeather() {
    var url = "https://api.open-meteo.com/v1/forecast?latitude=" + C.weather.lat + "&longitude=" + C.weather.lon +
      "&current=temperature_2m,weather_code&timezone=auto";
    var x = new XMLHttpRequest();
    x.open("GET", url, true);
    x.timeout = 10000;
    x.onload = function () {
      try {
        var j = JSON.parse(x.responseText);
        showWeather(j.current.temperature_2m, j.current.weather_code);
        store("tvhome.weather", JSON.stringify({ t: j.current.temperature_2m, c: j.current.weather_code }));
      } catch (e) { fromCache(); }
    };
    x.onerror = x.ontimeout = fromCache;
    x.send();
  }
  function fromCache() {
    try {
      var c = JSON.parse(store("tvhome.weather"));
      if (c) { showWeather(c.t, c.c); return; }
    } catch (e) {}
    $("w-desc").textContent = "Offline";
    $("w-place").textContent = C.weather.name;
  }
 
  /* ---------- Startup splash: glowing blob, then zoom out into Home ---------- */
  function runSplash(done) {
    var cv = $("blob"), g = cv.getContext("2d"), t0 = Date.now(), D = 2000, finished = false;
    g.scale(0.5, 0.5); // canvas is half resolution
    var COLS = ["rgba(70,190,255,", "rgba(60,255,200,", "rgba(120,140,255,"];
    function frame() {
      var t = Date.now() - t0, p = Math.min(1, t / D);
      g.globalCompositeOperation = "source-over";
      g.clearRect(0, 0, 600, 600);
      g.globalCompositeOperation = "lighter";
      var fade = p < 0.2 ? p / 0.2 : 1;
      for (var i = 0; i < COLS.length; i++) {
        var a = t / 650 + i * 1.26,
            r = (80 + 26 * Math.sin(t / 420 + i)) * (0.6 + 0.4 * fade),
            x = 300 + Math.cos(a) * 62 * (1 - p * 0.35),
            y = 300 + Math.sin(a * 1.3) * 62 * (1 - p * 0.35),
            gr = g.createRadialGradient(x, y, 0, x, y, r * 1.7);
        gr.addColorStop(0, COLS[i] + (0.85 * fade) + ")");
        gr.addColorStop(1, COLS[i] + "0)");
        g.fillStyle = gr; g.beginPath(); g.arc(x, y, r * 1.7, 0, 6.2832); g.fill();
      }
      if (p < 1) { requestAnimationFrame(frame); }
      else if (!finished) { finished = true; done(); }
    }
    requestAnimationFrame(frame);
    setTimeout(function () { if (!finished) { finished = true; done(); } }, D + 800); // safety net
  }
  function startHome() {
    var s = $("splash");
    s.className = "out";
    home.className = "in";
    ready = true;
    lastActivity = Date.now();
    setTimeout(function () { s.className = "gone"; }, 1000);
  }
 
  /* ---------- Keys ---------- */
  var KEY = { LEFT: 37, UP: 38, RIGHT: 39, DOWN: 40, ENTER: 13, RED: 403, GREEN: 404, YELLOW: 405, BLUE: 406 };
  function isBack(k) { return k === 8 || k === 27 || k === 461 || k === 10009 || k === 10182; }
  function setLite(on) {
    document.body.className = on ? "lite" : "";
    store("tvhome.lite", on ? "1" : "0");
  }
  function iconReport() {
    var s = "";
    for (var k in iconLog) { if (iconLog.hasOwnProperty(k)) { s += "\n" + k + ":" + iconLog[k]; } }
    return s;
  }
  var debugOn = false;
  function debugLog(e) {
    var d = $("debug");
    d.style.display = debugOn ? "block" : "none";
    if (debugOn) { d.textContent = "keyCode: " + e.keyCode + "\nkey: " + (e.key || "-") + "\nscreen: " + window.innerWidth + "x" + window.innerHeight + iconReport(); }
  }
  document.addEventListener("keydown", function (e) {
    var k = e.keyCode;
    ensureAudio();
    lastActivity = Date.now();
    if (k === KEY.BLUE || k === 68) { debugOn = !debugOn; }
    if (k === 49) { setLite(document.body.className !== "lite"); }
    if (debugOn || k === KEY.BLUE || k === 68) { debugLog(e); }
    if (saverOn) { hideSaver(); e.preventDefault(); return; }
    if (!ready) { return; }
    if (k === KEY.LEFT) { setFocus(focusIdx - 1); e.preventDefault(); }
    else if (k === KEY.RIGHT) { setFocus(focusIdx + 1); e.preventDefault(); }
    else if (k === KEY.ENTER) { openTile(); e.preventDefault(); }
    else if (k === KEY.UP) { setWallpaper(wpIdx + 1, true); e.preventDefault(); }
    else if (k === KEY.DOWN) { debugOn = !debugOn; debugLog(e); e.preventDefault(); }
    else if (k === KEY.RED || k === 87) { setWallpaper(wpIdx + 1, true); blip(660, 0.1, 0.05); e.preventDefault(); }
    else if (k === KEY.GREEN || k === 83) { showSaver(); e.preventDefault(); }
    else if (k === KEY.YELLOW || k === 82) { window.location.reload(); }
    else if (isBack(k)) { /* leave Back alone at Home so the TV can close the app */ }
  });
 
  /* ---------- Boot ---------- */
  if (C.lite || store("tvhome.lite") === "1" || /[?&]lite=1/.test(window.location.search)) { document.body.className = "lite"; }
  document.title = C.name || "TV Home";
  (function () {
    var b = $("brand"), parts = (C.name || "").split(" "), tv = parts.length > 1 ? parts.pop() : "";
    b.appendChild(document.createTextNode(parts.join(" ")));
    if (tv) { var s = document.createElement("span"); s.className = "tv"; s.textContent = tv; b.appendChild(s); }
  })();
  randomWallpaper();
  buildTiles();
  tick();
  setInterval(tick, 1000);
  loadWeather();
  setInterval(loadWeather, 15 * 60 * 1000);
  runSplash(startHome);
})();
</script>
