<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TV Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@200..800&display=swap">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; height: 100%; overflow: hidden; background: #000; color: #fff;
  font-family: "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif;
}

/* The whole UI is drawn on a fixed 1920x1080 stage and scaled to the screen. */
#stage {
  position: absolute; left: 0; top: 0; width: 1920px; height: 1080px;
  transform-origin: 0 0; overflow: hidden; background: #000;
}

/* Wallpaper: static layer, painted once. */
#bg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; transition: opacity .5s ease; }
#bg.swap { opacity: 0; }

#shade {
  position: absolute; left: 0; top: 0; width: 100%; height: 100%;
  background: linear-gradient(to bottom, rgba(0,0,0,.25) 0%, rgba(0,0,0,0) 35%, rgba(0,0,0,.45) 100%);
}

/* Glass panels are plain translucent (no blur) to keep weak TV chips smooth. */
.glass {
  background: linear-gradient(180deg, rgba(255,255,255,.15), rgba(255,255,255,.04)), rgba(18,24,40,.40);
  border: 1px solid rgba(255,255,255,.18);
  border-top-color: rgba(255,255,255,.38);
  border-radius: 30px;
}

/* Home */
#home { position: absolute; left: 0; top: 0; width: 100%; height: 100%; opacity: 0; transition: opacity .8s ease; }
#home.in { opacity: 1; }

#clockbox { position: absolute; left: 120px; top: 70px; }
#clock { font-size: 128px; font-weight: 200; letter-spacing: -2px; line-height: 1; }
#date { margin-top: 10px; font-size: 34px; font-weight: 400; opacity: .85; }

#widgets { position: absolute; right: 120px; top: 70px; width: 760px; height: 210px; }
.widget { position: absolute; top: 0; width: 360px; height: 210px; padding: 22px 30px; overflow: hidden; }
#w-weather { left: 0; }
#w-wall { right: 0; }
.w-title { font-size: 20px; text-transform: uppercase; letter-spacing: 3px; opacity: .7; }
.w-big { margin-top: 6px; font-size: 64px; font-weight: 200; line-height: 1; }
.w-big.small { font-size: 36px; font-weight: 600; margin-top: 26px; }
.w-sub { margin-top: 6px; font-size: 26px; }
.dim { opacity: .65; font-size: 22px; }

/* Tile row */
#rowwrap { position: absolute; left: 0; top: 340px; width: 100%; height: 300px; }
#row {
  position: absolute; left: 120px; top: 40px; white-space: nowrap; font-size: 0;
  transition: -webkit-transform .25s ease-out, transform .25s ease-out;
}
.tile {
  position: relative; display: inline-block; vertical-align: top;
  width: 380px; height: 214px; margin-right: 30px; border-radius: 28px; overflow: hidden;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.16);
  transition: -webkit-transform .28s cubic-bezier(.2,.9,.3,1.15), transform .28s cubic-bezier(.2,.9,.3,1.15);
  will-change: transform;
}
.tile .mono {
  position: absolute; left: 0; top: 0; width: 100%; height: 100%;
  font-size: 120px; font-weight: 700; line-height: 214px; text-align: center; opacity: .92;
}
.tile img { position: absolute; left: 50%; top: 50%; width: 62%; height: 64%; object-fit: contain; -webkit-transform: translate(-50%,-50%); transform: translate(-50%,-50%); }
.tile img.fav { width: 156px; height: 156px; padding: 18px; background: #fff; border-radius: 36px; }
.tile::before { content: ""; position: absolute; left: 0; top: 0; width: 100%; height: 100%;
  background: linear-gradient(180deg, rgba(255,255,255,.24) 0%, rgba(255,255,255,0) 45%); }
.tile::after { content: ""; position: absolute; left: 0; top: 0; width: 100%; height: 100%; opacity: 0;
  background: linear-gradient(115deg, rgba(255,255,255,0) 32%, rgba(255,255,255,.28) 50%, rgba(255,255,255,0) 68%); }
.tile.focus::after { opacity: 1; }
#label { position: absolute; top: 246px; width: 380px; margin-left: -190px; text-align: center; font-size: 28px; font-weight: 600; line-height: 34px; white-space: nowrap; }
.tile.focus {
  -webkit-transform: translateY(-12px) scale(1.12); transform: translateY(-12px) scale(1.12);
  box-shadow: 0 26px 44px rgba(0,0,0,.5), inset 0 0 0 1px rgba(255,255,255,.3);
  z-index: 5;
}

/* Recently opened row (small tiles) */
#recent { position: absolute; left: 120px; top: 700px; width: 1680px; height: 240px; }
.sec { font-size: 20px; letter-spacing: 3px; text-transform: uppercase; opacity: .7; }
#rrow { position: absolute; left: 0; top: 48px; white-space: nowrap; font-size: 0; }
#rlabel { position: absolute; top: 150px; width: 240px; margin-left: -120px; text-align: center; font-size: 24px; font-weight: 600; line-height: 30px; white-space: nowrap; }
#rempty { position: absolute; left: 0; top: 88px; font-size: 24px; opacity: .5; display: none; }
.tile.sm { width: 240px; height: 135px; margin-right: 20px; border-radius: 20px; will-change: auto; }
.tile.sm .mono { font-size: 72px; line-height: 135px; }
.tile.sm img.fav { width: 92px; height: 92px; padding: 12px; border-radius: 22px; }
.tile.sm.focus { -webkit-transform: translateY(-8px) scale(1.1); transform: translateY(-8px) scale(1.1); box-shadow: 0 16px 28px rgba(0,0,0,.5), inset 0 0 0 1px rgba(255,255,255,.3); }

/* Settings tile + tvOS-style settings app */
.tile .gear { position: absolute; left: 50%; top: 50%; width: 120px; height: 120px; margin: -60px 0 0 -60px; }
#panelwrap {
  position: absolute; left: 0; top: 0; width: 100%; height: 100%; background: linear-gradient(180deg, #0c1019 0%, #05070b 100%);
  opacity: 0; visibility: hidden; transition: opacity .25s ease, visibility 0s linear .25s;
}
#panelwrap.on { opacity: 1; visibility: visible; transition: opacity .25s ease; }
#spage, #sdetail { position: absolute; top: 0; height: 100%; opacity: 0; transition: opacity .28s ease, -webkit-transform .28s ease, transform .28s ease; }
#spage { left: 0; width: 100%; }
#sdetail { left: 50%; margin-left: -960px; width: 1920px; -webkit-transform: translateX(80px); transform: translateX(80px); }
#panelwrap.on #spage { opacity: 1; }
#panelwrap.on.cat #spage { opacity: 0; -webkit-transform: translateX(-80px); transform: translateX(-80px); }
#panelwrap.on.cat #sdetail { opacity: 1; -webkit-transform: translateX(0); transform: translateX(0); }
#stitle { position: absolute; left: 0; top: 70px; width: 100%; text-align: center; font-size: 40px; font-weight: 700; }
#slist { position: absolute; left: 50%; margin-left: -400px; top: 170px; width: 800px; }
.srow {
  position: relative; height: 84px; margin-bottom: 10px; padding: 0 28px; border-radius: 22px; background: rgba(255,255,255,.08);
  font-size: 28px; font-weight: 600; line-height: 84px; white-space: nowrap;
  transition: -webkit-transform .18s ease-out, transform .18s ease-out, background-color .18s ease;
  -webkit-animation: rowin .32s ease-out backwards; animation: rowin .32s ease-out backwards;
}
@-webkit-keyframes rowin { from { opacity: 0; -webkit-transform: translateY(16px); } to { opacity: 1; -webkit-transform: none; } }
@keyframes rowin { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
.srow:nth-child(2) { animation-delay: .03s; -webkit-animation-delay: .03s; }
.srow:nth-child(3) { animation-delay: .06s; -webkit-animation-delay: .06s; }
.srow:nth-child(4) { animation-delay: .09s; -webkit-animation-delay: .09s; }
.srow:nth-child(5) { animation-delay: .12s; -webkit-animation-delay: .12s; }
.srow:nth-child(6) { animation-delay: .15s; -webkit-animation-delay: .15s; }
.srow:nth-child(7) { animation-delay: .18s; -webkit-animation-delay: .18s; }
.srow:nth-child(8) { animation-delay: .21s; -webkit-animation-delay: .21s; }
.srow .sv { float: right; font-weight: 500; opacity: .6; }
.srow.main { height: 96px; line-height: 96px; padding-left: 108px; }
.srow.main .sico { position: absolute; left: 18px; top: 18px; width: 60px; height: 60px; padding: 11px; }
.srow.main .chev { position: absolute; right: 36px; top: 38px; width: 18px; height: 18px; border-top: 4px solid currentColor; border-right: 4px solid currentColor; -webkit-transform: rotate(45deg); transform: rotate(45deg); opacity: .5; }
.srow.focus { background: rgba(255,255,255,.94); color: #111; -webkit-transform: scale(1.03); transform: scale(1.03); }
.srow.focus .sv { opacity: .7; }
.sico { width: 64px; height: 64px; padding: 12px; border-radius: 16px; line-height: 0; }
.sico svg { display: block; }
#sleft { position: absolute; left: 140px; top: 250px; width: 640px; text-align: center; }
#sicon { width: 200px; height: 200px; padding: 44px; border-radius: 48px; margin: 0 auto 34px; }
#sname { font-size: 56px; font-weight: 700; }
#sdesc { margin-top: 16px; font-size: 26px; line-height: 36px; opacity: .6; }
#sright { position: absolute; left: 900px; top: 130px; width: 880px; }
#phint { position: absolute; left: 0; bottom: 32px; width: 100%; text-align: center; font-size: 20px; opacity: .5; }

/* Android-style Toast Notification */
#toast {
  position: absolute; left: 50%; bottom: 110px; -webkit-transform: translateX(-50%); transform: translateX(-50%);
  padding: 16px 34px; border-radius: 40px; background: rgba(30, 36, 48, 0.95);
  border: 1px solid rgba(255,255,255,0.22); color: #fff; font-size: 24px; font-weight: 500;
  white-space: nowrap; opacity: 0; pointer-events: none; z-index: 200;
  box-shadow: 0 12px 30px rgba(0,0,0,0.6); transition: opacity .25s ease;
}
#toast.on { opacity: 1; }

/* Developer Performance & RAM HUD Counter */
#perfhud {
  display: none; position: absolute; right: 24px; top: 20px; width: 390px;
  padding: 16px 20px; border-radius: 16px; background: rgba(8, 12, 20, 0.88);
  border: 1px solid rgba(91, 217, 140, 0.45); color: #e2e8f0;
  font: 18px/1.45 "Courier New", Courier, monospace; z-index: 150; pointer-events: none;
  box-shadow: 0 10px 25px rgba(0,0,0,0.5);
}
#perfhud .hud-title {
  color: #5bd98c; font-weight: 700; font-size: 16px; letter-spacing: 2px;
  text-transform: uppercase; border-bottom: 1px solid rgba(255,255,255,0.15);
  padding-bottom: 6px; margin-bottom: 8px;
}
#perfhud .hud-row { display: flex; justify-content: space-between; }
#perfhud .hud-val { color: #fff; font-weight: 700; }
#perfhud .hud-warn { color: #ffd84d; }
#perfhud .hud-bad { color: #ff6b6b; }

/* Wireframe debug mode */
body.wireframe .tile, body.wireframe .widget, body.wireframe #clockbox, body.wireframe #recent {
  outline: 2px dashed rgba(255, 80, 80, 0.85) !important;
}

/* Hint bar */
#hints {
  position: absolute; left: 50%; bottom: 18px; margin-left: -330px; width: 660px; height: 52px;
  border-radius: 26px; padding: 0 30px; font-size: 20px; line-height: 50px; white-space: nowrap; text-align: center; opacity: .9;
}
#hints span { margin: 0 12px; }
#hints .k { margin-right: 4px; font-size: 20px; }
#hints .r { color: #ff6b6b; } #hints .g { color: #5bd98c; } #hints .y { color: #ffd84d; } #hints .b { color: #5aa9ff; }

/* Screensaver */
#saver {
  position: absolute; left: 0; top: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,.62); opacity: 0; pointer-events: none; transition: opacity 1.5s ease;
}
#saver.on { opacity: 1; }
#saverclock {
  position: absolute; left: 0; top: 0; font-size: 220px; font-weight: 200; letter-spacing: -4px;
  transition: -webkit-transform 4s ease-in-out, transform 4s ease-in-out; opacity: .9;
}

/* Splash */
#splash {
  position: absolute; left: 0; top: 0; width: 100%; height: 100%; background: #000;
  transition: opacity .6s ease;
}
#splash canvas { position: absolute; left: 50%; top: 50%; margin: -300px 0 0 -300px; width: 600px; height: 600px; }
#splash.out { opacity: 0; pointer-events: none; }
#splash.gone { display: none; }

/* Debug overlay */
#debug {
  display: none; position: absolute; left: 20px; top: 20px; padding: 14px 20px; border-radius: 14px;
  background: rgba(0,0,0,.82); border: 1px solid rgba(255,255,255,.2);
  font: 20px/1.4 monospace; z-index: 99; white-space: pre; pointer-events: none;
}

#brand {
  position: absolute; left: 120px; top: 18px; height: 44px; line-height: 44px; white-space: nowrap;
  font-family: "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif;
  font-size: 40px; font-weight: 800; letter-spacing: -1px; text-transform: lowercase;
}
#brand .tv {
  display: inline-block; margin-left: 12px; padding: 0 11px; height: 30px; line-height: 30px; vertical-align: middle;
  position: relative; top: -2px; border-radius: 8px; background: #fff; color: #111;
  font-size: 20px; letter-spacing: 2px; text-transform: uppercase;
}

#ver { position: absolute; right: 24px; bottom: 20px; font-size: 16px; letter-spacing: 1px; opacity: .4; }

/* Lite mode: zero animation, minimal painting. Toggle with key 1, or open the app URL with ?lite=1 */
body.lite * { transition: none !important; animation: none !important; }
body.lite #shade { display: none; }
body.lite .tile { border-radius: 0; will-change: auto; }
body.lite .tile.focus { -webkit-transform: none; transform: none; }
body.lite .glass { border-radius: 0; }
body.lite .tile::before, body.lite .tile::after { display: none; }
body.lite .tile.focus, body.lite .tile.sm.focus { box-shadow: 0 0 0 4px #fff; }
</style>
</head>
<body>
<div id="stage">
  <div id="bg"></div>
  <div id="shade"></div>

  <div id="home">
    <div id="brand"></div>
    <div id="clockbox">
      <div id="clock">--:--</div>
      <div id="date"></div>
    </div>

    <div id="widgets">
      <div class="glass widget" id="w-weather">
        <div class="w-title">Weather</div>
        <div class="w-big" id="w-temp">--&deg;</div>
        <div class="w-sub" id="w-desc">Loading...</div>
        <div class="w-sub dim" id="w-place"></div>
      </div>
      <div class="glass widget" id="w-wall">
        <div class="w-title">Wallpaper</div>
        <div class="w-big small" id="w-wname">-</div>
        <div class="w-sub dim">Change it in Settings</div>
      </div>
    </div>

    <div id="rowwrap">
      <div id="row"></div>
    </div>

    <div id="recent">
      <div class="sec">Recently opened</div>
      <div id="rrow"></div>
      <div id="rempty">Apps you open will show up here</div>
    </div>

    <div id="hints" class="glass">
      <span><b>&#9664; &#9654;</b> Browse</span>
      <span><b>&#9650; &#9660;</b> Rows</span>
      <span><b>OK</b> Open</span>
    </div>
  </div>

  <div id="panelwrap">
    <div id="spage">
      <div id="stitle">Settings</div>
      <div id="slist"></div>
    </div>
    <div id="sdetail">
      <div id="sleft"><div id="sicon" class="sico"></div><div id="sname"></div><div id="sdesc"></div></div>
      <div id="sright"></div>
    </div>
    <div id="phint">&#9650; &#9660; Move &nbsp;&nbsp; OK Select &nbsp;&nbsp; Back Return</div>
  </div>

  <div id="saver"><div id="saverclock">--:--</div></div>

  <div id="splash"><canvas id="blob" width="300" height="300"></canvas></div>
  <div id="debug"></div>
  <div id="perfhud"></div>
  <div id="toast"></div>
  <div id="ver"></div>
</div>

<script>
// ===== TV Home config: edit the tiles, city and options below, push to GitHub, then reopen the app on the TV =====
window.TVHOME_CONFIG = {
  // App name shown on the home screen and in the page title.
  name: "Kivo TV",

  // Shown bottom-right and in the Info panel, so you can tell which file the TV is really running.
  version: "0.9",

  // Weather widget (Open-Meteo, no API key needed). Change to your city.
  weather: { name: "Hradec Králové", lat: 50.2104, lon: 15.8252 },

  // Idle time before the clock screensaver starts.
  saverAfterSec: 120,

  // Lite mode: no animations at all. Also toggled with key 1 on the remote, or add ?lite=1 to the app URL.
  lite: false,

  // Tiles. Each one opens its URL in the TV browser engine.
  tiles: [
    { name: "YouTube",     url: "https://www.youtube.com/tv",              color: ["#ff5a5a", "#a30f2d"], icon: "https://cdn.simpleicons.org/youtube/white",    domain: "youtube.com" },
    { name: "Netflix",     url: "https://www.netflix.com/",                color: ["#e50914", "#6b0409"], icon: "https://cdn.simpleicons.org/netflix/white",    domain: "netflix.com" },
    { name: "Prime Video", url: "https://www.primevideo.com/",             color: ["#1fa3ff", "#0b4a85"], icon: "https://cdn.simpleicons.org/primevideo/white", domain: "primevideo.com" },
    { name: "Disney+",     url: "https://www.disneyplus.com/",             color: ["#2f6bff", "#0f2468"], icon: "https://cdn.simpleicons.org/disneyplus/white", domain: "disneyplus.com" },
    { name: "Twitch",      url: "https://www.twitch.tv/",                  color: ["#9146ff", "#43199e"], icon: "https://cdn.simpleicons.org/twitch/white",     domain: "twitch.tv" },
    { name: "Spotify",     url: "https://open.spotify.com/",               color: ["#1ed760", "#0a5f2c"], icon: "https://cdn.simpleicons.org/spotify/white",    domain: "spotify.com" },
    { name: "Plex",        url: "https://app.plex.tv/desktop/",            color: ["#f0a90f", "#7a4f00"], icon: "https://cdn.simpleicons.org/plex/white",       domain: "plex.tv" },
    { name: "iVysílání",   slug: "ivysilani", url: "https://www.ceskatelevize.cz/ivysilani/", color: ["#12a8c4", "#0b6b80"], domain: "ceskatelevize.cz" }
  ]
};
</script>
<script>
/* TV Home - Apple TV style launcher for VIDAA (hisense://debug web app).
   Plain ES5 on purpose: older TV browsers choke on modern syntax. */
(function () {
  "use strict";

  var bootTime = Date.now();
  var errLog = [];
  window.onerror = function (msg, src, line) {
    errLog.push(String(msg).slice(0, 60) + " (line " + line + ")");
    if (errLog.length > 4) { errLog.shift(); }
    return false;
  };

  var C = window.TVHOME_CONFIG || { tiles: [], weather: { name: "", lat: 50, lon: 15 }, saverAfterSec: 120, sounds: true };
  function $(id) { return document.getElementById(id); }
  function store(k, v) { try { if (v === undefined) { return localStorage.getItem(k); } localStorage.setItem(k, v); } catch (e) {} return null; }
  function pad(n) { return (n < 10 ? "0" : "") + n; }

  /* Saved settings (kept in the TV browser's storage) */
  var S = {
    clock24: true,
    clockSec: false,
    showDate: true,
    tempF: false,
    wpKeep: false,
    showWeather: true,
    showWpWidget: true,
    showHints: true,
    uiScale: 1,
    recentMax: 6,
    sound: 0,
    saver: C.saverAfterSec || 120,
    saverBright: 0.9,
    devMode: false,
    perfHud: false,
    wireframe: false
  };
  try {
    var saved = JSON.parse(store("tvhome.settings") || "{}");
    for (var sk in saved) { if (saved.hasOwnProperty(sk)) { S[sk] = saved[sk]; } }
  } catch (e) {}
  function saveSettings() { store("tvhome.settings", JSON.stringify(S)); }

  var lastW = null;
  function fmtTime(d) {
    var hr = d.getHours(), min = pad(d.getMinutes()), sec = S.clockSec ? ":" + pad(d.getSeconds()) : "";
    if (S.clock24) { return pad(hr) + ":" + min + sec; }
    return ((hr % 12) || 12) + ":" + min + sec + (hr < 12 ? " AM" : " PM");
  }

  /* Toast helper (Android-style popup message) */
  var toastTimer = null;
  function showToast(msg) {
    var t = $("toast");
    t.textContent = msg;
    t.className = "on";
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.className = ""; }, 2400);
  }

  /* Apply visual visibility & layout settings */
  function applyLayoutPrefs() {
    $("date").style.display = S.showDate ? "block" : "none";
    $("w-weather").style.display = S.showWeather ? "block" : "none";
    $("w-wall").style.display = S.showWpWidget ? "block" : "none";
    $("hints").style.display = S.showHints ? "block" : "none";
    $("saverclock").style.opacity = String(S.saverBright || 0.9);
    if (S.wireframe) {
      if (document.body.className.indexOf("wireframe") < 0) { document.body.className += " wireframe"; }
    } else {
      document.body.className = document.body.className.replace(/\s*wireframe/g, "");
    }
    $("perfhud").style.display = S.perfHud ? "block" : "none";
    fit();
  }

  var stage = $("stage"), home = $("home"), row = $("row");
  var iconLog = {}, lastOffset = -1, lastHm = "", ready = false, saverOn = false, lastActivity = Date.now();

  /* ---------- Fit 1920x1080 stage to the real screen ---------- */
  var stageW = 1920;
  function fit() {
    var w = window.innerWidth, hh = window.innerHeight;
    var baseScale = Math.min(w / 1920, hh / 1080);
    var s = baseScale * (S.uiScale || 1);
    stageW = Math.round(w / s);
    stage.style.width = stageW + "px";
    stage.style.height = Math.round(hh / s) + "px";
    stage.style.webkitTransform = stage.style.transform = (s === 1 ? "none" : "scale(" + s + ")");
    stage.style.left = "0px";
    stage.style.top = "0px";
  }
  window.addEventListener("resize", function () { fit(); if (ready) { lastOffset = -1; refreshFocus(); } });
  fit();

  /* ---------- VIDAA RAM & Hardware Probe ---------- */
  var vidaaInfo = { sysRam: "Unknown", bridge: "None", headroomMB: null };

  function probeVidaaHardware() {
    // 1. Check navigator.deviceMemory (returns approximate GB of physical TV RAM, e.g., 1, 2, 4)
    if (navigator.deviceMemory) {
      vidaaInfo.sysRam = navigator.deviceMemory + " GB (Device)";
    }

    // 2. Scan proprietary Hisense / VIDAA globals exposed in hisense://debug
    var found = [];
    try {
      if (window.hisense) {
        found.push("window.hisense");
        if (typeof window.hisense.getMemoryInfo === "function") {
          vidaaInfo.sysRam = String(window.hisense.getMemoryInfo());
        } else if (typeof window.hisense.getTotalMemory === "function") {
          vidaaInfo.sysRam = Math.round(window.hisense.getTotalMemory() / 1048576) + " MB";
        }
      }

      { name: "Input & icon log box", opts: ["Hidden", "Shown"], get: function () { return debugOn ? 1 : 0; }, set: function (i) { debugOn = (i === 1); debugLog({ keyCode: "-" }); } },
      { name: "Layout wireframes", opts: ["Off", "On"], get: function () { return S.wireframe ? 1 : 0; }, set: function (i) { S.wireframe = (i === 1); saveSettings(); applyLayoutPrefs(); } },
      { name: "Refresh weather now", val: "Fetch", run: function () { loadWeather(); showToast("Fetching weather..."); } },
      { name: "Disable Developer Mode", val: "Lock", run: function () {
          S.devMode = false; S.perfHud = false; S.wireframe = false; debugOn = false;
          saveSettings(); applyLayoutPrefs(); debugLog({ keyCode: "-" });
          showToast("Developer mode disabled");
          showMain();
        } }
    ] }
  ];

  function visibleCats() {
    var out = [];
    for (var i = 0; i < ALL_CATS.length; i++) {
      if (!ALL_CATS[i].devOnly || S.devMode) { out.push(ALL_CATS[i]); }
    }
    return out;
  }

  function itemVal(it) {
    if (it.opts) { return it.opts[it.get()]; }
    var v = it.val;
    return (typeof v === "function") ? v() : (v || "");
  }
  function mk(tagName, cls) { var e = document.createElement(tagName); if (cls) { e.className = cls; } return e; }
  function paintSettings() {
    for (var i = 0; i < settingsEls.length; i++) { settingsEls[i].className = settingsBase + (i === SCR.idx ? " focus" : ""); }
  }
  function updateSettings() {
    if (!panelOpen || SCR.page < 0) { return; }
    var cats = visibleCats();
    if (!cats[SCR.page]) { return; }
    var items = cats[SCR.page].items;
    for (var i = 0; i < settingsVals.length; i++) { settingsVals[i].textContent = itemVal(items[i]); }
  }
  function showMain() {
    var cats = visibleCats();
    SCR.page = -1;
    SCR.idx = Math.min(SCR.mainIdx, cats.length - 1);
    settingsBase = "srow main";
    var list = $("slist");
    list.innerHTML = "";
    settingsEls = []; settingsVals = [];
    for (var i = 0; i < cats.length; i++) {
      var r = mk("div", "srow main"), ic = mk("div", "sico");
      ic.style.background = cats[i].color;
      ic.innerHTML = ICONS[cats[i].icon];
      r.appendChild(ic);
      r.appendChild(document.createTextNode(cats[i].name));
      r.appendChild(mk("span", "chev"));
      list.appendChild(r);
      settingsEls.push(r);
    }
    paintSettings();
    setPanelClass();
  }
  function showCat(ci) {
    var cats = visibleCats();
    SCR.mainIdx = SCR.idx; SCR.page = ci; SCR.idx = 0; resetArmed = false; settingsBase = "srow";
    var c = cats[ci];
    $("sicon").style.background = c.color;
    $("sicon").innerHTML = ICONS[c.icon];
    $("sname").textContent = c.name;
    $("sdesc").textContent = c.desc;
    var rt = $("sright");
    rt.innerHTML = "";
    settingsEls = []; settingsVals = [];
    for (var i = 0; i < c.items.length; i++) {
      var r = mk("div", "srow"), v = mk("span", "sv");
      r.appendChild(v);
      r.appendChild(document.createTextNode(c.items[i].name));
      rt.appendChild(r);
      settingsEls.push(r);
      settingsVals.push(v);
    }
    updateSettings();
    paintSettings();
    setPanelClass();
  }
  function setPanelClass() { $("panelwrap").className = panelOpen ? (SCR.page >= 0 ? "on cat" : "on") : ""; }
  function openPanel() { panelOpen = true; SCR.mainIdx = 0; showMain(); }
  function closePanel() { panelOpen = false; resetArmed = false; $("panelwrap").className = ""; }
  function stepItem(it, d) { var n = it.opts.length; it.set((it.get() + d + n) % n); updateSettings(); }
  function settingsKey(k) {
    var cats = visibleCats();
    var n = SCR.page < 0 ? cats.length : cats[SCR.page].items.length;
    if (k === KEY.UP) { SCR.idx = Math.max(0, SCR.idx - 1); paintSettings(); navBlip(); }
    else if (k === KEY.DOWN) { SCR.idx = Math.min(n - 1, SCR.idx + 1); paintSettings(); navBlip(); }
    else if (SCR.page < 0) {
      if (k === KEY.ENTER) { showCat(SCR.idx); }
      else if (isBack(k)) { closePanel(); }
    } else {
      var it = cats[SCR.page].items[SCR.idx];
      if (k === KEY.LEFT && it.opts) { stepItem(it, -1); }
      else if (k === KEY.RIGHT && it.opts) { stepItem(it, 1); }
      else if (k === KEY.ENTER) {
        if (it.opts) { stepItem(it, 1); }
        else if (it.run) { it.run(); updateSettings(); }
      }
      else if (isBack(k)) { showMain(); }
    }
  }

  /* Focus handling: only the focused element's class changes */
  function refreshFocus() {
    var el = rowsEls[rowIdx][idxs[rowIdx]] || null;
    if (focusEl && focusEl !== el) { focusEl.className = focusEl.className.replace(" focus", ""); }
    if (el && el.className.indexOf(" focus") < 0) { el.className += " focus"; }
    focusEl = el;
    var a = $("label"), r = $("rlabel");
    if (a) {
      if (rowIdx === 0 && APPS[idxs[0]]) { a.textContent = APPS[idxs[0]].name; a.style.left = (idxs[0] * 410 + 190) + "px"; }
      else { a.textContent = ""; }
    }
    if (r) {
      if (rowIdx === 1 && recentTiles[idxs[1]]) { r.textContent = recentTiles[idxs[1]].name; r.style.left = (idxs[1] * 260 + 120) + "px"; }
      else { r.textContent = ""; }
    }
    var offset = Math.max(0, (idxs[0] + 1) * 410 + 120 - (stageW - 220));
    if (offset !== lastOffset) {
      lastOffset = offset;
      row.style.webkitTransform = row.style.transform = "translateX(" + (-offset) + "px)";
    }
  }
  function rowCount(r) { return r === 0 ? APPS.length : recentTiles.length; }
  function moveCol(d) {
    var i = Math.max(0, Math.min(rowCount(rowIdx) - 1, idxs[rowIdx] + d));
    if (i !== idxs[rowIdx]) { idxs[rowIdx] = i; refreshFocus(); navBlip(); }
  }
  function moveRow(d) {
    var r = rowIdx + d;
    while (r >= 0 && r <= 1 && rowCount(r) === 0) { r += d; }
    if (r < 0 || r > 1) { return; }
    rowIdx = r;
    refreshFocus();
    navBlip();
  }
  function activate() {
    var t = rowIdx === 0 ? APPS[idxs[0]] : recentTiles[idxs[1]];
    if (!t) { return; }
    if (t.settings) { openPanel(); return; }
    pushRecent(t.name);
    if (S.sound >= 1) { blip(880, 0.12, 0.07); }
    setTimeout(function () { window.location.href = t.url; }, 140);
  }

  /* ---------- Clock + date + HUD tick ---------- */
  var DAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
  var MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
  function tick() {
    var d = new Date(), hm = fmtTime(d);
    if (hm !== lastHm) {
      lastHm = hm;
      $("clock").textContent = hm;
      $("saverclock").textContent = hm;
      $("date").textContent = DAYS[d.getDay()] + ", " + d.getDate() + " " + MONTHS[d.getMonth()];
    }
    if (S.perfHud) { updatePerfHud(); }
    if (!saverOn && S.saver > 0 && ready && Date.now() - lastActivity > S.saver * 1000) { showSaver(); }
  }

  /* ---------- Screensaver ---------- */
  var saverMove = null;
  function showSaver() {
    saverOn = true; $("saver").className = "on";
    moveSaver();
    saverMove = setInterval(moveSaver, 30000);
  }
  function moveSaver() {
    var c = $("saverclock");
    var tr = "translate(" + (120 + Math.floor(Math.random() * 1000)) + "px," + (80 + Math.floor(Math.random() * 640)) + "px)";
    c.style.webkitTransform = c.style.transform = tr;
  }
  function hideSaver() {
    saverOn = false; $("saver").className = ""; clearInterval(saverMove);
  }

  /* ---------- Weather (Open-Meteo) ---------- */
  function codeText(c) {
    if (c === 0) { return "Clear"; }
    if (c <= 2) { return "Partly cloudy"; }
    if (c === 3) { return "Overcast"; }
    if (c === 45 || c === 48) { return "Fog"; }
    if (c >= 51 && c <= 57) { return "Drizzle"; }
    if (c >= 61 && c <= 67) { return "Rain"; }
    if (c >= 71 && c <= 77) { return "Snow"; }
    if (c >= 80 && c <= 82) { return "Showers"; }
    if (c >= 85 && c <= 86) { return "Snow showers"; }
    if (c >= 95) { return "Thunderstorm"; }
    return "-";
  }
  function showWeather(t, code) {
    lastW = { t: t, c: code };
    $("w-temp").innerHTML = Math.round(S.tempF ? t * 9 / 5 + 32 : t) + "&deg;" + (S.tempF ? "F" : "C");
    $("w-desc").textContent = codeText(code);
    $("w-place").textContent = C.weather.name;
  }
  function loadWeather() {
    var url = "https://api.open-meteo.com/v1/forecast?latitude=" + C.weather.lat + "&longitude=" + C.weather.lon +
      "&current=temperature_2m,weather_code&timezone=auto";
    var x = new XMLHttpRequest();
    x.open("GET", url, true);
    x.timeout = 10000;
    x.onload = function () {
      try {
        var j = JSON.parse(x.responseText);
        showWeather(j.current.temperature_2m, j.current.weather_code);
        store("tvhome.weather", JSON.stringify({ t: j.current.temperature_2m, c: j.current.weather_code }));
      } catch (e) { fromCache(); }
    };
    x.onerror = x.ontimeout = fromCache;
    x.send();
  }
  function fromCache() {
    try {
      var c = JSON.parse(store("tvhome.weather"));
      if (c) { showWeather(c.t, c.c); return; }
    } catch (e) {}
    $("w-desc").textContent = "Offline";
    $("w-place").textContent = C.weather.name;
  }

  /* ---------- Startup splash: glowing blob, then zoom out into Home ---------- */
  function runSplash(done) {
    var cv = $("blob"), g = cv.getContext("2d"), t0 = Date.now(), D = 2000, finished = false;
    g.scale(0.5, 0.5);
    var COLS = ["rgba(70,190,255,", "rgba(60,255,200,", "rgba(120,140,255,"];
    function frame() {
      var t = Date.now() - t0, p = Math.min(1, t / D);
      g.globalCompositeOperation = "source-over";
      g.clearRect(0, 0, 600, 600);
      g.globalCompositeOperation = "lighter";
      var fade = p < 0.2 ? p / 0.2 : 1;
      for (var i = 0; i < COLS.length; i++) {
        var a = t / 650 + i * 1.26,
            r = (80 + 26 * Math.sin(t / 420 + i)) * (0.6 + 0.4 * fade),
            x = 300 + Math.cos(a) * 62 * (1 - p * 0.35),
            y = 300 + Math.sin(a * 1.3) * 62 * (1 - p * 0.35),
            gr = g.createRadialGradient(x, y, 0, x, y, r * 1.7);
        gr.addColorStop(0, COLS[i] + (0.85 * fade) + ")");
        gr.addColorStop(1, COLS[i] + "0)");
        g.fillStyle = gr; g.beginPath(); g.arc(x, y, r * 1.7, 0, 6.2832); g.fill();
      }
      if (p < 1) { requestAnimationFrame(frame); }
      else if (!finished) { finished = true; done(); }
    }
    requestAnimationFrame(frame);
    setTimeout(function () { if (!finished) { finished = true; done(); } }, D + 800);
  }
  function startHome() {
    var s = $("splash");
    s.className = "out";
    home.className = "in";
    ready = true;
    lastActivity = Date.now();
    setTimeout(function () { s.className = "gone"; }, 1000);
  }

  /* ---------- Keys ---------- */
  var KEY = { LEFT: 37, UP: 38, RIGHT: 39, DOWN: 40, ENTER: 13, RED: 403, GREEN: 404, YELLOW: 405, BLUE: 406 };
  function isBack(k) { return k === 8 || k === 27 || k === 461 || k === 10009 || k === 10182; }
  function setLite(on) {
    if (on) {
      if (document.body.className.indexOf("lite") < 0) { document.body.className += " lite"; }
    } else {
      document.body.className = document.body.className.replace(/\s*lite/g, "");
    }
    store("tvhome.lite", on ? "1" : "0");
    updateSettings();
  }
  function iconReport() {
    var s = "";
    for (var k in iconLog) { if (iconLog.hasOwnProperty(k)) { s += "\n" + k + ":" + iconLog[k]; } }
    return s;
  }
  var debugOn = false;
  function debugLog(e) {
    var d = $("debug");
    d.style.display = debugOn ? "block" : "none";
    if (debugOn) {
      d.textContent = "Kivo TV v" + (C.version || "?") +
        "\nkeyCode: " + e.keyCode +
        "\nkey: " + (e.key || "-") +
        "\nscreen: " + window.innerWidth + "x" + window.innerHeight +
        "\nerrors: " + (errLog.length ? "\n  " + errLog.join("\n  ") : "none") + iconReport();
    }
  }
  document.addEventListener("keydown", function (e) {
    var k = e.keyCode;
    ensureAudio();
    lastActivity = Date.now();
    if (k === KEY.BLUE || k === 68) {
      S.perfHud = !S.perfHud;
      saveSettings();
      applyLayoutPrefs();
      if (S.perfHud) { startPerfHud(); }
      updateSettings();
    }
    if (k === 49) { setLite(document.body.className.indexOf("lite") < 0); }
    if (debugOn) { debugLog(e); }
    if (saverOn) { hideSaver(); e.preventDefault(); return; }
    if (!ready) { return; }
    if (panelOpen) { settingsKey(k); e.preventDefault(); return; }
    if (k === KEY.LEFT) { moveCol(-1); e.preventDefault(); }
    else if (k === KEY.RIGHT) { moveCol(1); e.preventDefault(); }
    else if (k === KEY.UP) { moveRow(-1); e.preventDefault(); }
    else if (k === KEY.DOWN) { moveRow(1); e.preventDefault(); }
    else if (k === KEY.ENTER) { activate(); e.preventDefault(); }
    else if (k === KEY.RED || k === 87) { setWallpaper(wpIdx + 1, true); blip(660, 0.1, 0.05); e.preventDefault(); }
    else if (k === KEY.GREEN || k === 83) { showSaver(); e.preventDefault(); }
    else if (k === KEY.YELLOW || k === 82) { window.location.reload(); }
    else if (isBack(k)) { /* leave Back alone at Home so the TV can close the app */ }
  });

  /* ---------- Boot ---------- */
  if (C.lite || store("tvhome.lite") === "1" || /[?&]lite=1/.test(window.location.search)) { setLite(true); }
  applyLayoutPrefs();
  if (S.perfHud) { startPerfHud(); }
  document.title = C.name || "TV Home";
  $("ver").textContent = "v" + (C.version || "?");
  (function () {
    var b = $("brand"), parts = (C.name || "").split(" "), tv = parts.length > 1 ? parts.pop() : "";
    b.appendChild(document.createTextNode(parts.join(" ")));
    if (tv) { var s = document.createElement("span"); s.className = "tv"; s.textContent = tv; b.appendChild(s); }
  })();
  randomWallpaper();
  buildTiles();
  buildRecent();
  window.addEventListener("pageshow", function (ev) { if (ev.persisted) { buildRecent(); } });
  tick();
  setInterval(tick, 1000);
  loadWeather();
  setInterval(loadWeather, 15 * 60 * 1000);
  runSplash(startHome);
})();
</script>
</body>
</html>
